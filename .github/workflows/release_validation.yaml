name: Package Metadata Validation
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Swift package and resolved dependency metadata
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifest = fs.readFileSync('Package.swift', 'utf8');
            if (!/^\/\/ swift-tools-version: \d+\.\d+/m.test(manifest)) {
              throw new Error('Package.swift is missing its Swift tools version');
            }
            const resolved = JSON.parse(fs.readFileSync('Package.resolved', 'utf8'));
            if (resolved.version !== 3 || !Array.isArray(resolved.pins) || !resolved.pins.length) {
              throw new Error('Package.resolved must have a supported schema and dependency pins');
            }
            const identities = new Set();
            const locations = new Set();
            const normalize = value => value.toLowerCase().replace(/\.git$/, '');
            for (const pin of resolved.pins) {
              if (!pin.identity || identities.has(pin.identity)) {
                throw new Error(`Missing or duplicate dependency identity: ${pin.identity}`);
              }
              identities.add(pin.identity);
              if (pin.kind !== 'remoteSourceControl' || new URL(pin.location).protocol !== 'https:') {
                throw new Error(`Dependency must use HTTPS source control: ${pin.identity}`);
              }
              const location = normalize(pin.location);
              if (locations.has(location)) throw new Error(`Duplicate dependency location: ${pin.location}`);
              locations.add(location);
              if (!/^[a-f0-9]{40}$/i.test(pin.state?.revision ?? '')) {
                throw new Error(`Dependency needs an exact Git revision: ${pin.identity}`);
              }
              if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(pin.state?.version ?? '')) {
                throw new Error(`Dependency needs a semantic version: ${pin.identity}`);
              }
            }
            const declared = [...manifest.matchAll(/\.package\(url: "([^"]+)"/g)].map(match => match[1]);
            if (!declared.length) throw new Error('No package dependencies found in Package.swift');
            for (const location of declared) {
              if (new URL(location).protocol !== 'https:' || !locations.has(normalize(location))) {
                throw new Error(`Declared dependency is not pinned with HTTPS: ${location}`);
              }
            }
            core.info(`Validated Swift package manifest and ${identities.size} resolved dependency pins.`);
            // SwiftPM library releases use Git tags, not a package.json version.
            // A tag-versus-release comparison belongs to an explicit release workflow.
