name: Continuous Integration
on:
  push:
jobs:
  commitlint:
    name: CommitLint
    if: github.event.action != 'closed' || github.event.pull_request.merged != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install commitlint
        run: |
          bun install conventional-changelog-conventionalcommits
          bun install commitlint@latest
          bun install @commitlint/config-conventional@latest
      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: bunx commitlint --last --verbose
      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: bunx commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose
  check:
    name: Code Check
    runs-on: macos-latest
    if: github.event.action != 'closed' || github.event.pull_request.merged != true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned lint tools
        run: |
          mkdir -p "$RUNNER_TEMP/lint-tools"
          curl -fsSL https://github.com/realm/SwiftLint/releases/download/0.59.1/portable_swiftlint.zip -o "$RUNNER_TEMP/swiftlint.zip"
          curl -fsSL https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.0/swiftformat.zip -o "$RUNNER_TEMP/swiftformat.zip"
          unzip -oq "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/lint-tools"
          unzip -oq "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/lint-tools"
          echo "$RUNNER_TEMP/lint-tools" >> "$GITHUB_PATH"
      - name: Run SwiftLint
        run: |
          swiftlint
      - name: Run SwiftFormat in lint mode
        run: |
          swiftformat . --lint
  ios-build:
    name: iOS package build (Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build the iOS Swift package
        run: |
          xcodebuild -version
          xcodebuild build -scheme Mudmouth \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/MudmouthDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/MudmouthSourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      # Mudmouth has no SwiftPM test target. Interceptor's CI pins this package
      # revision and runs its app integration unit and simulator UI tests.
